name: Docker Compose Test

on:
  push:
    branches: [ "test/docker" ]
  pull_request:
    branches: [ "test/docker" ]

env:
  COMPOSE_DOCKER_CLI_BUILD: 1
  DOCKER_BUILDKIT: 1
  DATABASE_USER: postgres
  DATABASE_PASSWORD: postgres
  DATABASE_NAME: votes
  DATABASE_HOST: database
  REDIS_HOST: redis
  REDIS_PASSWORD: secretpassword
  OPTION_A: "Cats"
  OPTION_B: "Dogs"

jobs:
  test:
    runs-on: self-hosted-runner-workstation
    
    services:
      # Servicio de PostgreSQL para pruebas
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: votes
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      # Servicio de Redis para pruebas
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Cache Docker layers
      uses: actions/cache@v3
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-

    - name: Start Docker Compose stack
      run: |
        docker-compose -f docker-compose.yml up -d --build
        
        # Esperar a que los servicios estén saludables
        docker-compose ps
        
        # Verificar que los servicios estén en ejecución
        docker-compose ps | grep -v "Exit 0" | grep -v "exited (0)" | grep -v "Up" && exit 1 || echo "All services are up"
        
        # Esperar a que los servicios estén listos
        echo "Waiting for services to be ready..."
        sleep 30
        
        # Verificar estado de los contenedores después de la espera
        docker-compose ps

    - name: Run tests
      run: |
        # Verificar que los servicios están respondiendo
        curl -f http://localhost:80 || (echo "Vote service is not responding" && exit 1)
        curl -f http://localhost:3000 || (echo "Result service is not responding" && exit 1)
        
        # Verificar que Redis está accesible
        docker-compose exec -T redis redis-cli -a "${{ env.REDIS_PASSWORD }}" ping || \
          (echo "Cannot connect to Redis" && exit 1)
        
        # Verificar que la base de datos está accesible
        docker-compose exec -T database pg_isready -U postgres -d votes || \
          (echo "Cannot connect to PostgreSQL" && exit 1)

    - name: Clean up
      if: always()
      run: |
        docker-compose down -v
